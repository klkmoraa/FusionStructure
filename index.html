<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FusionStructure: herramientas de ingeniería en el navegador. FStructure para cálculo estructural y FModel para CAD 2D." />
    <meta name="theme-color" content="#F7F6F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FusionStructure · Herramientas de ingeniería" />
    <meta property="og:description" content="Calcula, dibuja y lee el resultado. Herramientas de ingeniería en el navegador." />
    <meta property="og:url" content="https://klkmoraa.github.io/FusionStructure/" />
    <meta property="og:image" content="https://klkmoraa.github.io/FusionStructure/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>FusionStructure · Herramientas de ingeniería</title>
    <script>
      // Día / Noche antes del primer pintado, para que no parpadee.
      try {
        var saved = localStorage.getItem('fs-theme');
        document.documentElement.dataset.theme = saved === 'dia' || saved === 'noche'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'noche' : 'dia';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
