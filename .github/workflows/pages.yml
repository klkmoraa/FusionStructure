name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar app principal
        run: npm ci

      - name: Regenerar identidad aqua
        run: node brandbook-site/scripts/build-brand-assets.mjs

      - name: Construir app principal
        run: npm run build

      - name: Preparar raíz de Pages
        run: |
          mkdir -p page
          cp -R dist/. page/
          rm -rf page/server
          test -f page/index.html
          cp page/index.html page/404.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: brandbook-site/package-lock.json

      - name: Instalar brandbook
        working-directory: brandbook-site
        run: npm ci

      - name: Construir brandbook estático
        working-directory: brandbook-site
        env:
          NEXT_PUBLIC_BRANDBOOK_BASE_PATH: /FusionStructure/brandbook
        run: npm run build:pages

      - name: Integrar /brandbook/
        run: |
          mkdir -p page/brandbook
          cp -R brandbook-site/dist-pages/. page/brandbook/
          touch page/.nojekyll
          test -f page/brandbook/index.html
          test -f page/brandbook/brand/fusionstructure-mark.svg
          test -f page/brandbook/motion/fusionstructure-brand-motion.mp4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: page

  deploy:
    name: Publicar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
