name: Deploy Landing Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: landing-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../fusionstructure-pages-output
          mkdir -p ../fusionstructure-pages-output
          cp -a dist/. ../fusionstructure-pages-output/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-publish
          git rm -rf .
          git clean -fdx

          cp -a ../fusionstructure-pages-output/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: landing ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages

      - name: Enable GitHub Pages from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"source":{"branch":"gh-pages","path":"/"}}'
          status="$(curl -sS -o pages-response.json -w "%{http_code}"             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"             -d "$payload")"

          cat pages-response.json || true

          if [[ "$status" == "201" || "$status" == "204" ]]; then
            echo "GitHub Pages enabled."
            exit 0
          fi

          if [[ "$status" == "409" ]]; then
            update_status="$(curl -sS -o pages-update-response.json -w "%{http_code}"               -X PUT               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"               -d "$payload")"
            cat pages-update-response.json || true
            [[ "$update_status" == "204" ]]
            exit $?
          fi

          echo "Pages API returned HTTP $status."
          exit 1
